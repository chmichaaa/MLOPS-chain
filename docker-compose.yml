# Self-contained stack for this project -- used both for local dev AND as the
# single-EC2-instance production deployment (see PROJECT_INDEX.md section 9):
# Postgres (MLflow + Airflow + dataset-uploader backends), MinIO (S3-compatible
# artifact/object store, replaces the real AWS S3 bucket), an MLflow tracking
# server, Airflow (standalone mode -- single container, fine for a
# student/demo deployment; a real multi-node Airflow would split
# webserver/scheduler/worker, which is overkill here), the FastAPI app itself,
# the dataset-uploader admin console, Prometheus + Grafana (real monitoring,
# scraping the app's own /metrics), and a low-volume traffic-generator that
# keeps the dashboards showing genuine (if synthetic) activity.
#
# Usage: cp .env.example .env (edit passwords), then `docker compose up -d --build`.
#   - App:              http://localhost:8005
#   - MLOps Console:  http://localhost:8090  (login/upload/dashboard/monitoring, see PROJECT_INDEX.md)
#   - Grafana:      http://localhost:3000  (or via the console's /monitoring page)
#   - Prometheus:   http://localhost:9090
#   - Airflow UI:  http://localhost:8080  (user/pass printed in container logs
#     on first start -- standalone mode generates one)
#   - MLflow UI:   http://localhost:5000
#   - MinIO console: http://localhost:9001
#
# On the production EC2 host, the CI deploy step (.github/workflows/main.yml)
# runs `docker compose pull app && docker compose up -d app` after a passing
# promotion gate -- see ECR_IMAGE in .env.example, which makes `app`'s image:
# resolve to the freshly-pushed ECR tag instead of a locally built one.

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mlops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlops}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      # -d postgres explicitly: without it, pg_isready defaults to a database
      # named after the user, which doesn't exist (only postgres/mlflow/
      # airflow/dataset_uploader do) -- harmless (the healthcheck still
      # passes), but it spams "FATAL: database <user> does not exist" into
      # the logs on every single probe.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mlops} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the bucket used for MLflow artifacts and for batch-
  # prediction/drift-monitoring uploads, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb -p local/${S3_BUCKET:-infra-monitoring}
      "

  mlflow-server:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    command: >
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER:-mlops}:${POSTGRES_PASSWORD:-mlops}@postgres:5432/mlflow
      --default-artifact-root s3://${S3_BUCKET:-infra-monitoring}/mlflow-artifacts
      --host 0.0.0.0 --port 5000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  # The served app. image: (with ECR_IMAGE unset) falls back to a local tag,
  # so `docker compose up --build app` works for local dev exactly as before;
  # in production, .env sets ECR_IMAGE to the real ECR URI so `docker compose
  # pull app` fetches that tag directly instead of rebuilding.
  app:
    build: .
    image: ${ECR_IMAGE:-mlops-infra-anomaly:local}
    restart: unless-stopped
    ports:
      - "8005:8005"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow-server:5000
      # Without this, mlflow.sklearn.load_model()/log_model() default to real
      # AWS S3 instead of MinIO -- fails with "InvalidAccessKeyId" since the
      # MinIO key isn't a real AWS IAM key. mlflow-server itself already sets
      # this (see its own environment above); every other service that
      # touches MLflow artifacts needs it too.
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      MINIO_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-infra-monitoring}
    depends_on:
      mlflow-server:
        condition: service_started

  # Keeps the Grafana dashboard (and MLflow/the app itself) showing genuine
  # activity instead of flat empty graphs -- reuses locustfile.py, which
  # already generates plausible random sensor readings against
  # /prediction_api, so this is real request/latency data, not faked numbers.
  # Same image as `app` (locust is already in requirements.txt), just started
  # with a different entrypoint/command. Low volume (2 simulated users) --
  # this is background ambiance, not a load test.
  traffic-generator:
    build: .
    image: ${ECR_IMAGE:-mlops-infra-anomaly:local}
    restart: unless-stopped
    entrypoint: ["locust"]
    command: ["-f", "locustfile.py", "--host", "http://app:8005", "--headless", "-u", "2", "-r", "1"]
    depends_on:
      app:
        condition: service_started

  # Internal admin console: login, dashboard, dataset/model upload -- see
  # PROJECT_INDEX.md for the full design. Bind-mounts the real repo checkout
  # (not a copy) so its git/dvc commands operate on the actual working tree
  # with the actual `origin` remote. Deliberately separate from the `app`
  # image -- this one needs a GitHub push token, which the CI-rebuilt served
  # app should never carry.
  dataset-uploader:
    build:
      context: .
      dockerfile: dataset_uploader/Dockerfile
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - .:/repo
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mlops}:${POSTGRES_PASSWORD:-mlops}@postgres:5432/dataset_uploader
      SIGNUP_CODE: ${SIGNUP_CODE:?set a real SIGNUP_CODE in .env}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:?set a real SESSION_SECRET_KEY in .env}
      GIT_TOKEN: ${GIT_TOKEN:?set a real GIT_TOKEN in .env}
      MLFLOW_TRACKING_URI: http://mlflow-server:5000
      # Without this, mlflow.sklearn.load_model()/log_model() default to real
      # AWS S3 instead of MinIO -- fails with "InvalidAccessKeyId" since the
      # MinIO key isn't a real AWS IAM key. mlflow-server itself already sets
      # this (see its own environment above); every other service that
      # touches MLflow artifacts needs it too.
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      MINIO_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-infra-monitoring}
      # The box's actual public address -- needed here because this service
      # renders links/iframes for the USER'S BROWSER (the "Open MLflow" link,
      # the embedded Grafana dashboard on /monitoring), which can't resolve
      # internal docker hostnames like mlflow-server or grafana. Set this to
      # your Elastic IP once you have one so it never needs updating again.
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
    depends_on:
      postgres:
        condition: service_healthy
      mlflow-server:
        condition: service_started

  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    restart: unless-stopped
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-mlops}:${POSTGRES_PASSWORD:-mlops}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      PYTHONPATH: /opt/airflow/project
      MLFLOW_TRACKING_URI: http://mlflow-server:5000
      # Without this, mlflow.sklearn.load_model()/log_model() default to real
      # AWS S3 instead of MinIO -- fails with "InvalidAccessKeyId" since the
      # MinIO key isn't a real AWS IAM key. mlflow-server itself already sets
      # this (see its own environment above); every other service that
      # touches MLflow artifacts needs it too.
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      MINIO_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-infra-monitoring}
      # dag_backup.py: pg_dump needs these directly (the SQLAlchemy URL above
      # embeds them but pg_dump takes plain env vars, not a URL), and the
      # BACKUP_* vars are a separate, real-AWS IAM user/bucket -- deliberately
      # not reusing AWS_ACCESS_KEY_ID/SECRET above, which are MinIO's
      # credentials, not real AWS ones.
      POSTGRES_USER: ${POSTGRES_USER:-mlops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlops}
      BACKUP_AWS_ACCESS_KEY_ID: ${BACKUP_AWS_ACCESS_KEY_ID:-}
      BACKUP_AWS_SECRET_ACCESS_KEY: ${BACKUP_AWS_SECRET_ACCESS_KEY:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - .:/opt/airflow/project
    command: standalone
    depends_on:
      postgres:
        condition: service_healthy
      mlflow-server:
        condition: service_started

  # Scrapes app:8005/metrics (already exposed via prometheus_fastapi_instrumentator
  # in main.py -- this is what was missing to actually make use of it).
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - app

  # Auto-provisioned (datasource + one starter dashboard, see grafana/provisioning/)
  # so there's nothing to click through manually on first start.
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set a real GRAFANA_ADMIN_PASSWORD in .env}
      # Lets dataset-uploader's /monitoring page embed the dashboard in an
      # iframe without a second login prompt -- anonymous sessions only ever
      # get read-only Viewer access, real admin/edit still requires the
      # actual login above. ALLOW_EMBEDDING overrides Grafana's default
      # X-Frame-Options, which otherwise blocks iframe embedding entirely.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      # Without this, Grafana defaults to assuming it's served from
      # http://localhost:3000/ -- fine for local dev, but on a real
      # deployment (accessed via the box's public IP/domain) Grafana can't
      # correctly resolve its own JS bundle paths at deeper URLs (e.g. a
      # dashboard's /d/<uid>/<slug>), and fails with its own "Grafana has
      # failed to load its application files" screen. Reuses the same
      # PUBLIC_HOST already set for dataset-uploader (see its own comment on
      # this) rather than introducing a second "the box's public address"
      # variable.
      GF_SERVER_ROOT_URL: http://${PUBLIC_HOST:-localhost}:3000/
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  grafana_data:
