on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

name: MLOps AWS

env:
  PYTHON_VERSION: '3.10'

jobs:
  # Fast, zero external dependencies (no MLflow/DVC/network/database needed)
  # -- pure unit tests for the evaluation-metric helpers, the feature
  # transformer, the LSTM autoencoder estimator (tiny toy data/1 epoch, so
  # this stays fast despite pulling in torch), and dataset_uploader's pure
  # logic (dataset_uploader/logic.py only imports stdlib +
  # prediction_model.config, so no fastapi/passlib/sqlalchemy install needed
  # here, unlike dataset_uploader/app.py itself).
  unit_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install --no-cache-dir -r requirements.txt
      - run: >
          python -m pytest -v
          tests/test_evaluation.py tests/test_preprocessing.py tests/test_dataset_uploader_logic.py
          tests/test_lstm_autoencoder.py tests/test_live_feed.py
          --junitxml=unit-test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: unit-test-results.xml

  # Trains + validates against whatever dataset.csv currently contains --
  # fails the job if the best model's F1 < config.F1_THRESHOLD. Which dataset
  # that is (harder real data vs. easy synthetic demo data) is controlled by
  # which processing/build_*.py script last wrote dataset.csv (see config.py
  # and training_pipeline.py) -- this job itself is dataset-agnostic.
  validate:
    needs: unit_tests
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_S3_ENDPOINT_URL: ${{ secrets.MINIO_ENDPOINT_URL }}
      MINIO_ENDPOINT_URL: ${{ secrets.MINIO_ENDPOINT_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install --no-cache-dir -r requirements.txt
      - run: pip install dvc[s3]
      - run: dvc remote modify --local myremote endpointurl "$MINIO_ENDPOINT_URL"
      - run: dvc pull --force
      - name: Train + validate (fails the job if F1 < config.F1_THRESHOLD)
        run: python -m prediction_model.training_pipeline

  integration_tests:
    needs: validate
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      # Required so mlflow.sklearn.load_model() (predict.py, used by
      # test_prediction.py) talks to MinIO instead of defaulting to real AWS
      # S3 -- without it, boto3 tries real AWS with MinIO credentials and
      # fails with "InvalidAccessKeyId" (the MinIO key isn't a real AWS IAM
      # key). validate doesn't need this since it never loads a model from
      # S3, only pulls data via dvc -- this job is the first one that does.
      MLFLOW_S3_ENDPOINT_URL: ${{ secrets.MINIO_ENDPOINT_URL }}
      MINIO_ENDPOINT_URL: ${{ secrets.MINIO_ENDPOINT_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install --no-cache-dir -r requirements.txt
      - run: pip install dvc[s3]
      - run: dvc remote modify --local myremote endpointurl "$MINIO_ENDPOINT_URL"
      - run: dvc pull --force
      - run: >
          python -m pytest -v tests/test_prediction.py tests/test_model_quality.py
          --junitxml=integration-test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: integration-test-results.xml

  build:
    needs: integration_tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push the image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.REPO_NAME }}
          IMAGE_TAG: latest
        run: |
          # Slim image (Priority 4): no training/tests/dvc baked in anymore --
          # the model is fetched from MLflow at runtime (see docker-compose.yml's
          # `app` service for the runtime config/credentials this now needs).
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  # Deploys to a single, already-provisioned EC2 instance (not EKS -- see
  # PROJECT_INDEX.md section 9). Only runs once `build` has succeeded, which
  # itself only runs once `validate` + `integration_tests` have passed -- i.e.
  # deploy is unreachable at all unless the promotion gate (F1 >=
  # config.F1_THRESHOLD) cleared. The EC2 box runs the same docker-compose.yml
  # as local dev (Postgres/MinIO/MLflow already up there); this step just
  # refreshes the `app` service to the freshly-pushed ECR image.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Deploy to EC2 over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ secrets.REPO_NAME }}:latest
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY,ECR_IMAGE
          script: |
            cd ~/MLOPS-chain
            git pull
            # Requires an IAM instance profile (or other locally-configured AWS
            # credentials) on this EC2 instance with ECR pull permissions --
            # see PROJECT_INDEX.md section 9 for the exact policy actions needed.
            aws ecr get-login-password --region eu-north-1 | docker login --username AWS --password-stdin "$ECR_REGISTRY"
            echo "ECR_IMAGE=$ECR_IMAGE" > .env.deploy
            docker compose --env-file .env --env-file .env.deploy pull app
            docker compose --env-file .env --env-file .env.deploy up -d app
